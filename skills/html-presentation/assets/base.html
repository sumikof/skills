<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title><!-- ===TITLE=== --></title>
<style>
/* =====================================================================
   Presentation Engine — このstyleブロックとページ末尾のscriptブロックは
   改変しないこと。見た目の変更はすべて下の style id="design"
   (デザインファイルのインライン展開先) で行う。
   スライドは 1280x720 (16:9) 固定で設計し、エンジンが画面にフィットさせる。
   ===================================================================== */
html,body{margin:0;padding:0;height:100%;background:#1a1a1a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
  transform:translate(-50%,-50%);background:#fff;
  box-shadow:0 0 40px rgba(0,0,0,.5)}
.slide{position:absolute;inset:0;width:1280px;height:720px;
  visibility:hidden;overflow:hidden;box-sizing:border-box}
.slide.active{visibility:visible}
/* JS無効環境へのフォールバック: 1枚目だけ表示し操作UIは隠す */
body:not(.js) .slide:first-of-type{visibility:visible}
body:not(.js) #hint,body:not(.js) #counter,body:not(.js) #progress{display:none}
#progress{position:fixed;left:0;bottom:0;height:4px;width:0;background:#888;z-index:10}
#counter{position:fixed;right:14px;bottom:10px;color:#999;
  font:12px/1 sans-serif;user-select:none;z-index:10}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  color:#eee;background:rgba(0,0,0,.65);padding:8px 18px;border-radius:6px;
  font:13px/1.6 sans-serif;transition:opacity 1s;z-index:10;pointer-events:none}
@media print{
  html,body{background:#fff;overflow:visible;height:auto}
  #stage{position:static;transform:none;box-shadow:none;width:1280px;height:auto}
  .slide{position:relative;visibility:visible;page-break-after:always;break-after:page}
  #progress,#counter,#hint{display:none}
  @page{size:1280px 720px;margin:0}
}
</style>
<style id="design">
/* ===DESIGN_CSS=== */
</style>
</head>
<body>
<div id="stage">
<!-- ===SLIDES=== -->
</div>
<div id="progress"></div>
<div id="counter"></div>
<div id="hint">← → / Space : 移動　　F : 全画面　　Home / End : 先頭・末尾　　Ctrl+P : PDF出力</div>
<script>
(function(){
"use strict";
document.body.classList.add("js");
var slides=[].slice.call(document.querySelectorAll(".slide")),n=slides.length,cur=-1;
/* ページ番号を各スライドに付与 (.no-num は除外。表紙などに使う) */
slides.forEach(function(s,i){
  if(!s.classList.contains("no-num")){
    var d=document.createElement("div");
    d.className="slide-no";d.textContent=String(i+1);s.appendChild(d);
  }
});
function fit(){
  var sc=Math.min(innerWidth/1280,innerHeight/720);
  document.getElementById("stage").style.transform=
    "translate(-50%,-50%) scale("+sc+")";
}
function show(i){
  var next=Math.max(0,Math.min(n-1,i));
  if(next===cur)return;
  cur=next;
  slides.forEach(function(s,j){s.classList.toggle("active",j===cur);});
  document.getElementById("counter").textContent=(cur+1)+" / "+n;
  document.getElementById("progress").style.width=((cur+1)/n*100)+"%";
  /* サンドボックスiframe等ではreplaceStateが例外を投げるため握りつぶす */
  try{history.replaceState(null,"","#"+(cur+1));}catch(e){}
}
addEventListener("resize",fit);
addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  switch(e.key){
    case "ArrowRight":case "ArrowDown":case " ":case "Enter":case "PageDown":
      show(cur+1);break;
    case "ArrowLeft":case "ArrowUp":case "PageUp":
      show(cur-1);break;
    case "Home":show(0);break;
    case "End":show(n-1);break;
    case "f":case "F":
      try{
        document.fullscreenElement?document.exitFullscreen()
          :document.documentElement.requestFullscreen().catch(function(){});
      }catch(e){}
      break;
    default:return;
  }
  e.preventDefault();
});
addEventListener("click",function(e){
  if(e.clientX<innerWidth*0.2)show(cur-1);else show(cur+1);
});
var sx=0;
addEventListener("touchstart",function(e){sx=e.touches[0].clientX;});
addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].clientX-sx;
  if(dx<-40)show(cur+1);else if(dx>40)show(cur-1);
});
setTimeout(function(){
  var h=document.getElementById("hint");
  h.style.opacity=0;setTimeout(function(){h.remove();},1000);
},5000);
fit();
show((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
</body>
</html>
