<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title><!-- ===TITLE=== --></title>
<!-- エンジンCSS(土台)→デザインCSS(見た目) の順で読み込む。順序を入れ替えない。 -->
<link rel="stylesheet" href="engine.css">
<link rel="stylesheet" href="===DESIGN_CSS_HREF===">
</head>
<body>
<div id="stage">
<!-- ===SLIDES=== -->
</div>
<div id="progress"></div>
<div id="counter"></div>
<div id="hint">← → / Space : 移動　　F : 全画面　　Home / End : 先頭・末尾　　Ctrl+P : PDF出力</div>
<script>
(function(){
"use strict";
document.body.classList.add("js");
var slides=[].slice.call(document.querySelectorAll(".slide")),n=slides.length,cur=-1;
/* ページ番号を各スライドに付与 (.no-num は除外。表紙などに使う) */
slides.forEach(function(s,i){
  if(!s.classList.contains("no-num")){
    var d=document.createElement("div");
    d.className="slide-no";d.textContent=String(i+1);s.appendChild(d);
  }
});
function fit(){
  var sc=Math.min(innerWidth/1280,innerHeight/720);
  document.getElementById("stage").style.transform=
    "translate(-50%,-50%) scale("+sc+")";
}
function show(i){
  var next=Math.max(0,Math.min(n-1,i));
  if(next===cur)return;
  cur=next;
  slides.forEach(function(s,j){s.classList.toggle("active",j===cur);});
  document.getElementById("counter").textContent=(cur+1)+" / "+n;
  document.getElementById("progress").style.width=((cur+1)/n*100)+"%";
  /* サンドボックスiframe等ではreplaceStateが例外を投げるため握りつぶす */
  try{history.replaceState(null,"","#"+(cur+1));}catch(e){}
}
addEventListener("resize",fit);
addEventListener("keydown",function(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  switch(e.key){
    case "ArrowRight":case "ArrowDown":case " ":case "Enter":case "PageDown":
      show(cur+1);break;
    case "ArrowLeft":case "ArrowUp":case "PageUp":
      show(cur-1);break;
    case "Home":show(0);break;
    case "End":show(n-1);break;
    case "f":case "F":
      try{
        document.fullscreenElement?document.exitFullscreen()
          :document.documentElement.requestFullscreen().catch(function(){});
      }catch(e){}
      break;
    default:return;
  }
  e.preventDefault();
});
addEventListener("click",function(e){
  if(e.clientX<innerWidth*0.2)show(cur-1);else show(cur+1);
});
var sx=0;
addEventListener("touchstart",function(e){sx=e.touches[0].clientX;});
addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].clientX-sx;
  if(dx<-40)show(cur+1);else if(dx>40)show(cur-1);
});
setTimeout(function(){
  var h=document.getElementById("hint");
  h.style.opacity=0;setTimeout(function(){h.remove();},1000);
},5000);
fit();
show((parseInt(location.hash.slice(1),10)||1)-1);
})();
</script>
</body>
</html>
